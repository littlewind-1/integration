<!DOCTYPE html>
<html lang="ko" data-theme="light"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VL르웨스트 하우스키핑 통합관리</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
:root{--bg:#f1f5f9;--card:#fff;--fg:#0f172a;--mut:#64748b;--ln:#d5dce6;--ac:#1f5fbf;--onac:#fff;--ac2:#e8eef9;--bad:#dc2626;--ok:#15803d}
[data-theme="dark"]{--bg:#0b1220;--card:#162033;--fg:#f1f5f9;--mut:#94a3b8;--ln:#2d3b52;--ac:#5b9bff;--onac:#06101f;--ac2:#1d2b45;--bad:#f87171;--ok:#4ade80}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;height:100dvh;overflow:hidden;font-size:14px}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:9px;padding:7px 13px;font-weight:600;font-size:13.5px;white-space:nowrap}
button:hover{filter:brightness(.96)}
button.on,button.pri{background:var(--ac);color:var(--onac);border-color:var(--ac)}
header#top{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:8px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--ac);color:var(--onac);font-weight:800;display:grid;place-items:center;font-size:14px}
.brand b{display:block;font-size:15px}
.brand small{color:var(--mut);font-size:11.5px}
nav#tabs{display:flex;gap:6px;flex:1;overflow-x:auto;min-width:0}
.act{display:flex;gap:6px;align-items:center}
.dd{position:relative}
#bkm{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:6px;display:none;min-width:210px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#bkm.open{display:grid;gap:4px}
#bkm button{text-align:left;border:0;background:transparent}
#bkm button:hover{background:var(--ac2);filter:none}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.pane{flex:1;min-height:0}
#home{overflow:auto}
.frame iframe{width:100%;height:100%;border:0;display:block}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));padding:16px;max-width:1200px;margin:0 auto}
.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px}
.c h3{margin:0 0 12px;font-size:15px}
.wide{grid-column:1/-1}
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hero small{color:var(--mut)}
.hero h2{margin:2px 0 0;font-size:22px}
.qa{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;gap:26px;margin-bottom:10px}
.n{font-size:32px;font-weight:800;line-height:1.1}
.stat small,.mut{color:var(--mut)}
.n.bad,.neg{color:var(--bad)}
.n.ok{color:var(--ok)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--ac2);font-size:12.5px;margin:2px 3px 2px 0}
.t7{width:100%;border-collapse:collapse}
.t7 th,.t7 td{padding:8px;border-bottom:1px solid var(--ln);text-align:center}
.t7 th{color:var(--mut);font-weight:600;font-size:12.5px}
.t7 td.sun,.t7 td.sat{font-weight:700}
.t7 td.sun{color:#dc2626}.t7 td.sat{color:#2563eb}
.note{font-size:12.5px;color:var(--mut);line-height:1.6;margin:10px 0 0}
p{margin:6px 0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:99;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
@media (max-width:640px){.brand small{display:none}.n{font-size:26px}}
</style></head>
<body>
<header id="top">
  <div class="brand"><span class="logo">VL</span><div><b>VL르웨스트 하우스키핑 통합관리</b><small>HK 스케쥴표 · 정비 배정표</small></div></div>
  <nav id="tabs">
    <button data-tab="home">홈</button>
    <button data-tab="hk">HK 스케쥴표</button>
    <button data-tab="jb">정비 배정표</button>
  </nav>
  <div class="act">
    <button id="sync" title="선택한 정비 배정표 날짜의 스케쥴표 출근자를 근무자 목록에 반영">출근자 연동</button>
    <button id="theme"></button>
    <div class="dd"><button id="bk">백업 ▾</button>
      <div id="bkm"><button id="bkx">백업 파일 내보내기</button><button id="bki">백업 파일 불러오기</button></div>
    </div>
    <input type="file" id="bkf" accept=".json,application/json" hidden>
  </div>
</header>
<main>
  <section id="home" class="pane"></section>
  <div id="hk" class="pane frame" hidden></div>
  <div id="jb" class="pane frame" hidden></div>
</main>
<div id="toast" hidden></div>

  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("hk-sched:"))months.push(k.slice(9));else if(k.startsWith("jb-as:"))copies.push(k.slice(6))}}catch(x){}
  months.sort();copies.sort();
  $("#home").innerHTML=`<div class="grid">
  <div class="c wide hero"><div><small>오늘</small><h2>${dstr}</h2></div>
    <div class="qa"><button data-go="hk">HK 스케쥴표 열기</button><button data-go="jb">정비 배정표 열기</button><button class="pri" data-act="sync">스케쥴표 출근자 → 정비 배정 연동</button></div></div>
  <div class="c"><h3>오늘 HK 출근 현황</h3>${c1}</div>
  <div class="c"><h3>정비 배정 현황</h3>${c2}</div>
  <div class="c wide"><h3>향후 7일 출근 전망</h3><div style="overflow:auto"><table class="t7"><thead><tr><th>날짜</th><th>요일</th><th>룸코디 출근</th><th>필요 인원</th><th>과부족</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  <div class="c wide"><h3>저장된 데이터</h3>
    <p>HK 스케쥴표: ${months.length?months.map(m=>`<span class="chip">${e(m)}</span>`).join(""):'<span class="mut">없음</span>'}</p>
    <p>정비 배정표 다른이름 저장본: ${copies.length?copies.map(m=>`<span class="chip">${e(m)}</span>`).join(""):'<span class="mut">없음</span>'}</p>
    <p class="note">데이터는 이 컴퓨터의 브라우저에 저장됩니다. 다른 PC·브라우저로 옮기거나 정리 전에는 상단 [백업 ▾ → 백업 파일 내보내기]로 한 번에 보관하세요.</p></div>
  </div>`;
}
$("#home").addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;
  if(b.dataset.go)show(b.dataset.go);
  if(b.dataset.act=="sync")sync();
});

/* ---------- 출근자 연동 (스케쥴표 → 정비 배정표 근무자) ---------- */
async function sync(){
  show("jb");
  const f=await mount("jb"),w=f.contentWindow;
  const dt=w.document.getElementById("dt").value;
  if(!dt)return toast("정비 배정표의 날짜를 먼저 선택하세요");
  const[y,m,d]=dt.split("-").map(Number),ym=y+"-"+pad(m),s=hkMonth(ym);
  if(!s||!s.rows)return toast(`${y}년 ${m}월 스케쥴표 데이터가 없습니다`);
  const i=d-1,norm=n=>String(n||"").replace(/\(.*?\)/g,"").replace(/\s/g,"");
  const co=new Map();
  s.rows.slice(13).forEach(r=>{const n=norm(r[0]);if(n)co.set(n,r[3+i]||"")});
  const ws=JSON.parse(JSON.stringify(w.eval("S.w")));
  const on=[],off=[],unk=[],chg=[],known=new Set();
  ws.forEach((x,k)=>{
    const n=norm(x.n);if(!n)return;known.add(n);
    if(!co.has(n)){unk.push(x.n);return}
    const v=co.get(n),p=(v=="1"||v=="특");
    (p?on:off).push(x.n);
    if(!!x.on!==p)chg.push([k,p]);
  });
  const extra=[...co].filter(([n,v])=>(v=="1"||v=="특")&&!known.has(n)).map(([n])=>n);
  const lab=`${m}월 ${d}일(${DY[new Date(y,m-1,d).getDay()]})`;
  let msg=`${lab} 스케쥴표 기준으로 근무자 출근 체크를 맞춥니다.\n\n· 출근 ${on.length}명 / 출근 아님 ${off.length}명\n· 체크 상태가 바뀌는 근무자 ${chg.length}명`;
  if(unk.length)msg+=`\n· 스케쥴표에서 이름을 찾지 못해 그대로 둔 근무자 ${unk.length}명`;
  if(extra.length)msg+=`\n· 스케쥴표엔 출근인데 근무자 목록에 없는 사람: ${extra.join(", ")}`;
  msg+=`\n\n※ 반차·교육·출장은 출근으로 보지 않습니다(스케쥴표의 출근 인원 집계와 동일: 1, 특).\n적용할까요?`;
  if(!confirm(msg))return;
  w.eval(`(${JSON.stringify(chg)}).forEach(c=>{S.w[c[0]].on=c[1]});rW();$("#ws").click()`);
  toast(`${lab} 출근자 ${on.length}명 반영 완료`+(extra.length?` · 목록에 없는 출근자 ${extra.length}명은 근무자 추가 필요`:""));
}
$("#sync").onclick=sync;

/* ---------- 백업 ---------- */
const isKey=k=>/^(hk-sched:|hk-print$|jb-|theme$)/.test(k);
$("#bk").onclick=ev=>{ev.stopPropagation();$("#bkm").classList.toggle("open")};
document.addEventListener("click",()=>$("#bkm").classList.remove("open"));
$("#bkx").onclick=()=>{
  try{const w=F.hk&&F.hk.contentWindow;if(w&&w.eval("dirty")&&confirm("스케쥴표에 저장되지 않은 변경이 있습니다.\n저장한 뒤 백업할까요?"))w.eval("save()")}catch(x){}
  const data={};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(isKey(k))data[k]=localStorage.getItem(k)}}catch(x){}
  const n=Object.keys(data).length;
  if(!n)return toast("백업할 저장 데이터가 없습니다");
  const now=new Date(),name=`VL르웨스트_통합관리_백업_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}.json`;
  const url=URL.createObjectURL(new Blob([JSON.stringify({app:"vl-hk-platform",v:1,at:now.toISOString(),data},null,1)],{type:"application/json"}));
  const a=document.createElement("a");a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);
  toast(`✓ 백업 파일 저장 (${n}개 항목)`);
};
$("#bki").onclick=()=>$("#bkf").click();
$("#bkf").onchange=async ev=>{
  const f=ev.target.files[0];ev.target.value="";if(!f)return;
  let o;try{o=JSON.parse(await f.text())}catch(x){return toast("백업 파일을 읽을 수 없습니다")}
  if(!o||o.app!="vl-hk-platform"||!o.data)return toast("이 플랫폼의 백업 파일이 아닙니다");
  const ks=Object.keys(o.data).filter(isKey);
  if(!ks.length)return toast("불러올 데이터가 없습니다");
  if(!confirm(`백업 파일(${ks.length}개 항목)을 불러옵니다.\n같은 이름의 저장 데이터(스케쥴 월, 근무자·세대 리스트, 통계 등)는 백업 내용으로 덮어씌워집니다.\n계속할까요?`))return;
  ks.forEach(k=>lsSet(k,o.data[k]));
  toast("✓ 불러오기 완료 — 화면을 새로 고칩니다");
  setTimeout(()=>location.reload(),900);
};

applyTheme();
show((location.hash||"#home").slice(1));
</script>
</body></html>
