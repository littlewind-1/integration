<!DOCTYPE html>
<html lang="ko" data-theme="light"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VL르웨스트 하우스키핑 통합관리</title>
<style>

:root{--bg:#f1f5f9;--card:#fff;--fg:#0f172a;--mut:#64748b;--ln:#d5dce6;--ac:#1f5fbf;--onac:#fff;--ac2:#e8eef9;--bad:#dc2626;--ok:#15803d}
[data-theme="dark"]{--bg:#0b1220;--card:#162033;--fg:#f1f5f9;--mut:#94a3b8;--ln:#2d3b52;--ac:#5b9bff;--onac:#06101f;--ac2:#1d2b45;--bad:#f87171;--ok:#4ade80}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;height:100dvh;overflow:hidden;font-size:14px}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:9px;padding:7px 13px;font-weight:600;font-size:13.5px;white-space:nowrap;transition:transform .08s cubic-bezier(.4,0,.2,1),filter .15s,box-shadow .12s;user-select:none}
button:hover{filter:brightness(.96)}
button:active{transform:scale(0.95) translateY(1px);filter:brightness(.90)}
button.on,button.pri{background:var(--ac);color:var(--onac);border-color:var(--ac)}
header#top{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:8px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--ac);color:var(--onac);font-weight:800;display:grid;place-items:center;font-size:14px}
.brand b{display:block;font-size:15px}
.brand small{color:var(--mut);font-size:11.5px}
nav#tabs{display:flex;gap:6px;flex:1;overflow-x:auto;min-width:0}
.act{display:flex;gap:6px;align-items:center}
.dd{position:relative}
#bkm{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:6px;display:none;min-width:210px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#bkm.open{display:grid;gap:4px}
#bkm button{text-align:left;border:0;background:transparent}
#bkm button:hover{background:var(--ac2);filter:none}
main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.pane{flex:1;min-height:0}
#home{overflow:auto}
.frame iframe{width:100%;height:100%;border:0;display:block}
.frame.off{visibility:hidden;position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:-1}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));padding:16px;max-width:1280px;margin:0 auto}
.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px}
.c h3{margin:0 0 12px;font-size:15px}
.wide{grid-column:1/-1}
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hero small{color:var(--mut)}
.hero h2{margin:2px 0 0;font-size:22px}
.qa{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;gap:22px;margin-bottom:10px;flex-wrap:wrap}
.n{font-size:30px;font-weight:800;line-height:1.1}
.stat small,.mut{color:var(--mut)}
.n.bad,.neg{color:var(--bad)}
.n.ok{color:var(--ok)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--ac2);font-size:12.5px;margin:2px 3px 2px 0}
.t7{width:100%;border-collapse:collapse}
.t7 th,.t7 td{padding:8px;border-bottom:1px solid var(--ln);text-align:center}
.t7 th{color:var(--mut);font-weight:600;font-size:12.5px}
.t7 td.sun,.t7 td.sat{font-weight:700}
.t7 td.sun{color:#dc2626}.t7 td.sat{color:#2563eb}
.note{font-size:12.5px;color:var(--mut);line-height:1.6;margin:10px 0 0}
p{margin:6px 0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:99;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
/* 모달 (alert/confirm 대체) */
#modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
#modal-overlay.open{display:flex}
#modal-box{background:var(--card);color:var(--fg);border:1px solid var(--ln);border-radius:14px;padding:20px;max-width:440px;width:100%;box-shadow:0 16px 36px rgba(0,0,0,.25)}
#modal-msg{white-space:pre-line;line-height:1.55;margin:0 0 18px;font-size:14px}
#modal-btns{display:flex;justify-content:flex-end;gap:8px}
@media (max-width:640px){.brand small{display:none}.n{font-size:24px}}
@media print{
 @page{size:A4 portrait;margin:10mm}
 body.ph{display:block;height:auto!important;overflow:visible!important;background:#fff!important;color:#000!important;--bg:#fff;--card:#fff;--fg:#000;--ln:#bbb;--mut:#555;--ac2:#eef2f8;--ac:#1f5fbf;--bad:#dc2626;--ok:#15803d;font-size:12px}
 body.ph header#top,body.ph .qa,body.ph #toast,body.ph #modal-overlay,body.ph .frame{display:none!important}
 body.ph main{display:block}
 body.ph #home{overflow:visible;display:block!important}
 body.ph .grid{grid-template-columns:1fr 1fr;max-width:none;padding:0;gap:10px}
 body.ph .c{break-inside:avoid;page-break-inside:avoid}
 body.ph *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style></head>
<body>
<header id="top">
  <div class="brand"><span class="logo">VL</span><div><b>VL르웨스트 하우스키핑 통합관리</b><small>HK 스케쥴 · 정비 배정 · 마스터시트 · 세팅/재고현황</small></div></div>
  <nav id="tabs">
    <button data-tab="home">홈</button>
    <button data-tab="hk">HK 스케쥴표</button>
    <button data-tab="jb">정비 배정표</button>
    <button data-tab="ms">정비 마스터시트</button>
    <button data-tab="iv">세팅/재고현황</button>
  </nav>
  <div class="act">
    <button id="sync" title="선택한 정비 배정표 날짜 기준으로 스케쥴표 출근자 + 마스터시트 세대 리스트를 반영">출근자·세대 연동</button>
    <span id="cloud" class="mut" style="font-size:12px;white-space:nowrap"></span>
    <button id="theme"></button>
    <div class="dd"><button id="bk">백업 ▾</button>
      <div id="bkm"><button id="bkx">백업 파일 내보내기</button><button id="bki">백업 파일 불러오기</button></div>
    </div>
    <input type="file" id="bkf" accept=".json,application/json" hidden>
  </div>
</header>
<main>
  <section id="home" class="pane"></section>
  <div id="hk" class="pane frame off"></div>
  <div id="jb" class="pane frame off"></div>
  <div id="ms" class="pane frame off"></div>
  <div id="iv" class="pane frame off"></div>
</main>
<div id="toast" hidden></div>
<div id="modal-overlay">
  <div id="modal-box">
    <p id="modal-msg"></p>
    <div id="modal-btns">
      <button id="modal-cancel">취소</button>
      <button id="modal-ok" class="pri">확인</button>
    </div>
  </div>
</div>

const DKEY=dt=>"jb-day:"+dt;
function getSavedDates(){
  const dates=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith("jb-day:"))dates.push(k.slice(7));

}
function formatDateLabel(dt){
  const p=dt.split("-").map(Number);
  if(p.length!==3||!p[0])return dt;
  const d=new Date(p[0],p[1]-1,p[2]);

}

function loadDayData(targetDt,silent){

function deleteDayData(){

function gen(){

 const left=[];

/* ---------- 앱(iframe) 불러오기 ---------- */
const BODYCLS={hk:"h-screen overflow-hidden flex flex-col",ms:"text-slate-800 antialiased min-h-screen flex flex-col",iv:"p-2 sm:p-4"};
function mount(k){
  if(F[k])return F[k].__p;
  const tpl=document.getElementById("tpl-"+k);
  if(!tpl)return Promise.resolve(null);
  const f=document.createElement("iframe");
  f.title=TAB_NAMES[k]||k;
  F[k]=f;
  f.__p=new Promise(res=>{f.onload=()=>{try{const c=BODYCLS[k];if(c)f.contentDocument.body.className=c}catch(x){}applyTheme();res(f)}});
  // template 내부 HTML 직렬화 후 srcdoc에 주입 (script 태그 정상 실행 보장)
  const holder=document.createElement("div");
  holder.appendChild(tpl.content.cloneNode(true));
  f.srcdoc="<!DOCTYPE html>\n"+holder.innerHTML.trim();
  $("#"+k).appendChild(f);
  if(k=="jb")f.__p.then(initJb);
  f.__p.then(hookFrame);
  return f.__p;
}

  TABS.forEach(k=>{const el=$("#"+k);if(k=="home")el.hidden=k!=t;else el.classList.toggle("off",k!=t)});
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab==t));
  $("#sync").hidden=(t=="hk"||t=="iv");
  if(t=="home")renderHome();else mount(t);
  try{history.replaceState(null,"","#"+t)}catch(x){}
}

/* ---------- 스케쥴표 데이터 읽기 ---------- */
function hkMonth(ym){
  const f=F.hk;
  if(f){try{const w=f.contentWindow;if(w.eval("cur")===ym)return JSON.parse(JSON.stringify(w.eval("collect()")))}catch(x){}}
  return ld("hk-sched:"+ym);
}
function hkDay(date){
  const ym=date.getFullYear()+"-"+pad(date.getMonth()+1),s=hkMonth(ym);
  if(!s||!s.rows)return null;
  const d=date.getDate(),i=d-1,w=date.getDay(),hol=HOL.has(ym+"-"+pad(d));
  let t=s.t&&s.t[i];
  if(t==null||(t==="31"&&needDef(w,hol)!==31))t=needDef(w,hol);
  const need=parseFloat(t)||0;
  let si=s.rows.findIndex(r=>String(r[0]||"").trim()==="원영순");if(si<0)si=13;
  const a=s.rows.slice(si).filter(r=>{const v=r[3+i];return v=="1"||v=="교"}).length;
  const codes={};
  s.rows.forEach(r=>{if(!String(r[0]||"").trim())return;const v=r[3+i];if(v&&v!="1"&&CODE_NM[v])codes[v]=(codes[v]||0)+1});
  return{a,need,sh:a-need,codes};
}

/* ---------- 출근자 · 세대 리스트 연동 (스케쥴표/마스터시트 → 정비 배정표) ---------- */
function initJb(f){
  const w=f.contentWindow;
  try{
    w.document.getElementById("dt").addEventListener("change",()=>{
      const dt=w.document.getElementById("dt").value;
      if(dt&&ld("jb-day:"+dt))return;
      sync("date");
    });
  }catch(x){}
  sync("mount");
}
async function sync(mode){
  const auto=(mode==="mount"||mode==="date");
  if(!auto)show("jb");
  const f=await mount("jb"),w=f.contentWindow;
  let dt;try{dt=w.document.getElementById("dt").value}catch(x){return}
  if(!dt){if(!auto)toast("정비 배정표의 날짜를 먼저 선택하세요");return}
  const[y,m,d]=dt.split("-").map(Number),ym=y+"-"+pad(m),s=hkMonth(ym);
  const lab=`${m}월 ${d}일(${DY[new Date(y,m-1,d).getDay()]})`;
  const norm=n=>String(n||"").replace(/\(.*?\)/g,"").replace(/\s/g,"");
  let on=[],off=[],unk=[],chg=[],extra=[],hasAtt=false;
  if(s&&s.rows){
    hasAtt=true;
    const i=d-1,co=new Map(),known=new Set();
    let si=s.rows.findIndex(r=>String(r[0]||"").trim()==="원영순");if(si<0)si=13;
    s.rows.slice(si).forEach(r=>{const n=norm(r[0]);if(n)co.set(n,r[3+i]||"")});
    const ws=JSON.parse(JSON.stringify(w.eval("S.w")));
    ws.forEach((x,k)=>{
      const n=norm(x.n);if(!n)return;known.add(n);
      if(!co.has(n)){unk.push(x.n);return}
      const v=co.get(n),p=(v=="1"||v=="교");
      (p?on:off).push(x.n);
      if(!!x.on!==p)chg.push([k,p]);
    });
    extra=[...co].filter(([n,v])=>(v=="1"||v=="교")&&!known.has(n)).map(([n])=>n);
  }
  const ms=ld("hk-master-sheet"),hasMs=!!(ms&&ms.rows&&ms.rows.length);
  const loadUnits=hasMs&&(mode!=="mount"||!w.eval('S.u.slice(22).some(x=>String(x.r).trim())'));
  if(!auto){
    if(!hasAtt&&!hasMs)return toast(`${y}년 ${m}월 스케쥴표와 마스터시트 데이터가 없습니다`);
    let msg=`${lab} 기준으로 정비 배정표에 연동합니다.\n`;
    msg+=hasAtt?`\n[출근자] 출근 ${on.length}명 / 출근 아님 ${off.length}명 · 체크 상태 변경 ${chg.length}명`:`\n[출근자] ${y}년 ${m}월 스케쥴표 데이터가 없어 건너뜁니다`;
    if(unk.length)msg+=`\n· 스케쥴표에서 이름을 찾지 못해 그대로 둔 근무자 ${unk.length}명`;
    if(extra.length)msg+=`\n· 스케쥴표엔 출근인데 근무자 목록에 없는 사람: ${extra.join(", ")}`;
    msg+=hasMs?`\n\n[세대 리스트] 정비 마스터시트에서 해당 요일 세대를 23번부터 불러옵니다(기존 23번 이후 목록은 교체)`:`\n\n[세대 리스트] 저장된 마스터시트 세대가 없어 건너뜁니다`;
    msg+=`\n\n※ 반차·휴무·연차·특근·출장은 출근으로 보지 않습니다(1, 교만 출근).\n※ 마스터시트는 저장된 내용 기준입니다.\n적용할까요?`;
    if(!(await showConfirm(msg)))return;
  }
  if(chg.length)w.eval(`(${JSON.stringify(chg)}).forEach(c=>{S.w[c[0]].on=c[1]});rW();$("#ws").click()`);
  else if(hasAtt)w.eval('rW()');
  let un="";
  if(loadUnits){
    try{w.eval('setDy();$("#ml").click()');un=" · 세대 리스트 갱신"}catch(x){}
  }
  if(!hasAtt&&!loadUnits&&auto)return;
  toast(`${lab} `+(hasAtt?`출근자 ${on.length}명 반영`:"")+un+(extra.length?` · 목록에 없는 출근자 ${extra.length}명은 근무자 추가 필요`:""));
}

/* ===== 실시간 자동 저장 + 여러 사람 공유 (db) ===== */
const SHARED=k=>/^(hk-sched:|hk-master-sheet$|integrated_inventory_sheets_v3$|jb-)/.test(k);
const TABK=k=>k.startsWith("hk-sched:")?"hk":k=="hk-master-sheet"?"ms":k.startsWith("integrated_")?"iv":"jb";
const TABID=Math.random().toString(36).slice(2),CH=50000;
const enc=k=>k.replace(/[^A-Za-z0-9_\-:@+]/g,c=>"~"+c.codePointAt(0).toString(16)+"~");
let DB=null,RO=false,sent={},tm={},chain={},stale=new Set(),act={},at={};
const cloud=(t,bad)=>{const el=$("#cloud");el.textContent=t;el.style.color=bad?"var(--bad)":""};
const clk=()=>new Date().toLocaleTimeString("ko-KR");
const rawSet=Storage.prototype.setItem;
function pushHook(k,v){k=String(k);if(!DB||RO||!SHARED(k))return;v=String(v);if(sent[k]===v)return;clearTimeout(tm[k]);tm[k]=setTimeout(()=>flush(k),500)}
Storage.prototype.setItem=function(k,v){rawSet.call(this,k,v);pushHook(k,v)};
function flush(k){
  chain[k]=(chain[k]||Promise.resolve()).then(async()=>{
    const v=lsGet(k);if(v==null||sent[k]===v||!DB||RO)return;
    cloud("동기화 중…");
    try{
      const id=enc(k),ts=Date.now();
      if(v.length<=CH)await DB.doc("kv/"+id).set({k,v,ts,by:TABID});
      else{
        const n=Math.ceil(v.length/CH);
        for(let i=0;i<n;i++)await DB.doc("kvc/"+id+"~"+i).set({v:v.slice(i*CH,(i+1)*CH),ts});
        await DB.doc("kv/"+id).set({k,n,ts,by:TABID});
      }
      sent[k]=v;cloud("● 실시간 공유 · 저장됨 "+clk());
    }catch(x){cloud("공유 저장 실패 ("+((x&&x.code)||"오류")+")",1)}
  });
  return chain[k];
}
const flushAll=()=>Promise.all(Object.keys(tm).map(k=>{clearTimeout(tm[k]);return flush(k)}));
async function readDoc(d){
  const o=d.data();if(!o||!o.k)return null;
  if(typeof o.v==="string")return[o.k,o.v];
  const id=enc(o.k),p=[];for(let i=0;i<o.n;i++)p.push(DB.doc("kvc/"+id+"~"+i).get());
  const s=await Promise.all(p);let v="";
  for(const x of s){const c=x.data();if(!c||c.ts!==o.ts)return null;v+=c.v}
  return[o.k,v];
}
async function applyRemote(snap,first){
  const have=new Set();
  for(const ch of snap.docChanges()){
    if(ch.type==="removed")continue;
    const o=ch.doc.data();if(!o||!o.k)continue;have.add(o.k);
    if(o.by===TABID||!SHARED(o.k))continue;
    const r=await readDoc(ch.doc);if(!r)continue;
    const[k,v]=r;if(lsGet(k)===v){sent[k]=v;continue}
    rawSet.call(localStorage,k,v);sent[k]=v;stale.add(TABK(k));
  }
  return have;
}
async function bootSync(){
  $("#home").innerHTML='<p class="mut" style="padding:20px">공유 데이터를 불러오는 중…</p>';
  cloud("로컬 저장");
  try{
    const cl=window.claude;if(!cl||!cl.use)return;
    DB=await cl.use("db");if(!DB)return;
    try{const u=await cl.use("user");if(u&&u.can&&u.can("data.write")===false)RO=true}catch(x){}
    await new Promise(res=>{
      let first=true;const to=setTimeout(res,8000);
      DB.collection("kv").onSnapshot(async snap=>{
        try{
          const have=await applyRemote(snap,first);
          if(first){
            first=false;clearTimeout(to);
            for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(SHARED(k)&&!have.has(k))pushHook(k,localStorage.getItem(k))}
            cloud(RO?"읽기 전용 (공유 쓰기 권한 없음)":"● 실시간 공유 · 연결됨");res();
          }
        }catch(x){if(first){first=false;clearTimeout(to);res()}}
      },e=>{cloud("공유 연결 오류 — 이 PC에만 저장됩니다",1);res()});
    });
  }catch(x){cloud("공유 연결 실패 — 이 PC에만 저장됩니다",1)}
}
/* 자동 저장: 입력 후 1.5초 뒤 각 화면의 저장 기능을 자동 실행 */
const AS={
  hk:w=>{if(w.eval("dirty"))w.eval("save()")},
  ms:w=>{if(w.eval("isDirty"))w.eval("localStorage.setItem(LS,JSON.stringify(S));dirty(false)")},
  jb:w=>{w.eval('sv("jb-state",S);if($("#dt").value&&ld(DKEY($("#dt").value)))saveDayData(true)')},
  iv:w=>{if(w.eval("!!editingCell"))return 1;const t=w.showToast;w.showToast=()=>{};try{w.saveToLocalStorage()}finally{w.showToast=t}}
};
function touch(k){act[k]=Date.now();clearTimeout(at[k]);at[k]=setTimeout(()=>{at[k]=0;const f=F[k];if(!f)return;let r;try{r=AS[k](f.contentWindow)}catch(x){}if(r){touch(k)}},1500)}
function hookFrame(f){
  const k=Object.keys(F).find(x=>F[x]===f);if(!k)return;
  let w,d;try{w=f.contentWindow;d=w.document}catch(x){return}
  const o=w.Storage.prototype.setItem;
  w.Storage.prototype.setItem=function(a,b){o.call(this,a,b);pushHook(a,b)};
  const ev=k=="jb"?["input","change"]:["input","change","keyup","mouseup","paste","cut"];
  ev.forEach(e=>d.addEventListener(e,()=>touch(k),true));
}
/* 다른 사람이 바꾼 내용 반영: 내가 입력 중이 아닐 때 해당 화면을 다시 불러옴 */
function reloadTab(k){const box=$("#"+k);box.innerHTML="";delete F[k];mount(k)}
setInterval(()=>{
  stale.forEach(k=>{
    if(!F[k]){stale.delete(k);return}
    if(at[k]||Date.now()-(act[k]||0)<4000)return;
    stale.delete(k);reloadTab(k);
    toast("다른 사용자가 수정한 내용을 반영했습니다 · "+TAB_NAMES[k]);
    if(!$("#home").hidden)renderHome();
  });
},1500);

applyTheme();
bootSync().then(()=>{
  show((location.hash||"#home").slice(1));
  ["ms","jb","hk","iv"].forEach((k,i)=>setTimeout(()=>mount(k),150+i*400));
});
</script>
